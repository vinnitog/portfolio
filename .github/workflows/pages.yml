name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: npm test

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/assets/fonts
          cp index.html styles.css script.js sw.js manifest.webmanifest _site/
          cp assets/icon.svg assets/icon-192.png assets/icon-512.png assets/icon-maskable-512.png _site/assets/
          cp assets/avatar-vinicius-128.jpg assets/social-card.png _site/assets/
          cp assets/scroll-runner.png assets/scroll-runner-frame-2.png assets/scroll-runner-frame-3.png _site/assets/
          cp assets/fonts/archivo-latin.woff2 assets/fonts/manrope-latin.woff2 _site/assets/fonts/
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 17
          find _site -type f -print | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
